name: build runner gce image

on:
  workflow_dispatch:
    inputs:
      runner_version:
        description: "GitHub Actions runner version"
        default: "2.332.0"
        required: true
      go_version:
        description: "Go version to pre-install"
        default: "1.23.6"
        required: false
      node_major_version:
        description: "Node.js major version (LTS) to pre-install"
        default: "22"
        required: false
      jit_runners_version:
        description: "jit-runners project version (auto-detected from git if empty)"
        default: ""
        required: false
      distribute:
        description: "Replicate image to US, EU, Asia multi-regions"
        type: boolean
        default: true
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "infra/packer/**"

permissions: {}

env:
  GCE_DISTRIBUTION_LOCATIONS: '["us", "eu", "asia"]'

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Determine jit-runners version
        id: version
        run: |
          if [ -n "${{ inputs.jit_runners_version }}" ]; then
            VERSION="${{ inputs.jit_runners_version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "jit-runners version: ${VERSION}"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCE_BUILD_WIF_PROVIDER }}
          service_account:            ${{ secrets.GCE_BUILD_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Packer
        uses: hashicorp/setup-packer@c3d53c525d422944e50ee27b840746d6522b08de # v3.2.0

      - name: Packer init
        working-directory: infra/packer
        run: packer init .

      - name: Packer validate
        working-directory: infra/packer
        run: |
          packer validate -only=googlecompute.jit-runner \
            -var "gcp_project=$(gcloud config get-value project 2>/dev/null)" \
            -var "runner_version=${{ inputs.runner_version || '2.332.0' }}" \
            .

      - name: Packer build
        working-directory: infra/packer
        run: |
          GCP_PROJECT="$(gcloud config get-value project 2>/dev/null)"
          RUNNER_VERSION="${{ inputs.runner_version || '2.332.0' }}"
          GO_VERSION="${{ inputs.go_version || '1.23.6' }}"
          NODE_MAJOR="${{ inputs.node_major_version || '22' }}"
          JIT_VERSION="${{ steps.version.outputs.version }}"

          ARGS="-only=googlecompute.jit-runner"
          ARGS="${ARGS} -var gcp_project=${GCP_PROJECT}"
          ARGS="${ARGS} -var runner_version=${RUNNER_VERSION}"
          ARGS="${ARGS} -var go_version=${GO_VERSION}"
          ARGS="${ARGS} -var node_major_version=${NODE_MAJOR}"
          ARGS="${ARGS} -var jit_runners_version=${JIT_VERSION}"

          # PR builds: private (single-region), distinct prefix
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS="${ARGS} -var ami_name_prefix=jit-runner-pr"
            ARGS="${ARGS} -var gcp_image_storage_locations=[\"us-central1\"]"
          else
            DISTRIBUTE="${{ inputs.distribute || 'true' }}"
            if [ "${DISTRIBUTE}" = "true" ]; then
              # Packer's googlecompute plugin only accepts ONE storage location
              # per image; specifying multiple returns "Invalid image storage
              # locations: Must not have more than 1 region". Using "us"
              # (multi-region) keeps the image globally accessible from a single
              # primary region. Multi-region replication to eu/asia, if needed,
              # is a separate gcloud compute images create step (follow-up).
              ARGS="${ARGS} -var gcp_image_storage_locations=[\"us\"]"
            fi
          fi

          packer build ${ARGS} .

      - name: Extract image name and summary
        working-directory: infra/packer
        run: |
          IMAGE_ID=$(jq -r '.builds[-1].artifact_id' manifest.json)
          RUNNER_VERSION="${{ inputs.runner_version || '2.332.0' }}"
          JIT_VERSION="${{ steps.version.outputs.version }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "## PR Test GCE Image Build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## GCE Image Build Complete" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ----- | ----- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image ID | \`${IMAGE_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| jit-runners Version | ${JIT_VERSION} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner Version | ${RUNNER_VERSION} |" >> "$GITHUB_STEP_SUMMARY"

          GO_VERSION="${{ inputs.go_version || '1.23.6' }}"
          NODE_MAJOR="${{ inputs.node_major_version || '22' }}"
          echo "| Go Version | ${GO_VERSION} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Node.js | ${NODE_MAJOR}.x LTS |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "| Distributed To | _(none — PR test build, single region)_ |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "This image will be cleaned up after the build." >> "$GITHUB_STEP_SUMMARY"
          else
            DISTRIBUTE="${{ inputs.distribute || 'true' }}"
            if [ "${DISTRIBUTE}" = "true" ]; then
              echo "| Distributed To | us, eu, asia multi-regions |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| Distributed To | _(none — source region only)_ |" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Use this image as \`var.runner_image\` in infra/terraform-gcp/." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cleanup PR test image
        if: always() && github.event_name == 'pull_request'
        working-directory: infra/packer
        run: |
          if [ ! -f manifest.json ]; then
            echo "No manifest.json found — Packer did not produce an image. Skipping cleanup."
            exit 0
          fi

          IMAGE_NAME=$(jq -r '.builds[-1].artifact_id' manifest.json)
          GCP_PROJECT="$(gcloud config get-value project 2>/dev/null)"

          echo "Deleting PR test image ${IMAGE_NAME}..."
          gcloud compute images delete "${IMAGE_NAME}" --project="${GCP_PROJECT}" --quiet || true

          echo "PR test image cleaned up."
