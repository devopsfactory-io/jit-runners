name: shell

on:
  pull_request:
    paths:
      - "infra/scripts/**"
      - ".github/workflows/shellcheck.yml"
  push:
    branches: [main]
    paths:
      - "infra/scripts/**"

permissions: {}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: shellcheck
        run: shellcheck infra/scripts/ami-prune.sh infra/scripts/test/fake-aws infra/scripts/test/run.sh infra/scripts/test/cases/*.sh
      - name: script tests
        run: infra/scripts/test/run.sh
