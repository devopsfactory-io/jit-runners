AWSTemplateFormatVersion: "2010-09-09"
Description: jit-runners - On-demand GitHub Actions self-hosted runners (Lambda + EC2 spot)

Parameters:
  GitHubAppId:
    Type: String
    Description: GitHub App ID (numeric).

  GitHubInstallationId:
    Type: String
    Description: GitHub App installation ID (numeric) used by lifecycle and scaledown for installation-token minting.

  LambdaS3Bucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment packages.

  WebhookLambdaS3Key:
    Type: String
    Description: S3 key for the webhook Lambda zip (e.g. jit-runners/v0.1.0/webhook-linux-amd64.zip).

  ScaleUpLambdaS3Key:
    Type: String
    Description: S3 key for the scale-up Lambda zip.

  ScaleDownLambdaS3Key:
    Type: String
    Description: S3 key for the scale-down Lambda zip.

  LifecycleLambdaS3Key:
    Type: String
    Description: S3 key for the lifecycle Lambda zip.

  RebalancerLambdaS3Key:
    Type: String
    Description: S3 key for the rebalancer Lambda zip (e.g. v1.0.0-rc.4/rebalancer.zip).

  WebhookSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing the GitHub App webhook secret.

  PrivateKeySecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing the GitHub App private key (PEM).

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where runner EC2 instances will launch.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for runner EC2 instances (private subnets recommended).

  DefaultAMI:
    Type: AWS::EC2::Image::Id
    Description: Default AMI ID for runner instances (Amazon Linux 2023 recommended).

  LabelMappings:
    Type: String
    Default: "[]"
    Description: "(Optional) JSON array of label-to-instance-type mappings."

  StaleThresholdMinutes:
    Type: Number
    Default: 10
    Description: Minutes before a pending runner is considered stale.

  MaxRunnerAgeMinutes:
    Type: Number
    Default: 360
    Description: Maximum age in minutes before a running instance is force-terminated.

  MaxReEnqueueAttempts:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 10
    Description: Max re-enqueue attempts before a stuck pending job goes terminal.

Resources:
  # --- DynamoDB ---

  RunnersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-runners"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: runner_id
          AttributeType: S
      KeySchema:
        - AttributeName: runner_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-runners"

  # --- SQS ---

  ScaleUpDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-scaleup-dlq"
      MessageRetentionPeriod: 1209600

  ScaleUpQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-scaleup"
      VisibilityTimeout: 120
      MessageRetentionPeriod: 3600
      ReceiveMessageWaitTimeSeconds: 10
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScaleUpDLQ.Arn
        maxReceiveCount: 3

  LifecycleQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-lifecycle-dlq"
      MessageRetentionPeriod: 1209600

  LifecycleQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-lifecycle"
      VisibilityTimeout: 90
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt LifecycleQueueDLQ.Arn
        maxReceiveCount: 5

  # --- EC2 Security Group ---

  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: jit-runners EC2 instances - egress only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to GitHub and AWS APIs
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP for package managers
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
          Description: DNS
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-runner"

  # --- EC2 Spot Service-Linked Role ---

  EC2SpotServiceLinkedRole:
    Type: AWS::IAM::ServiceLinkedRole
    Properties:
      AWSServiceName: spot.amazonaws.com
      Description: Allows EC2 Spot to launch, tag, and manage spot instances on behalf of jit-runners.

  # --- EC2 IAM ---

  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-runner"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SelfTerminate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    "ec2:ResourceTag/managed-by": jit-runners
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !GetAtt RunnerAgentLogGroup.Arn
                  - !GetAtt RunnerUserdataLogGroup.Arn
                  - !Sub "${RunnerAgentLogGroup.Arn}:log-stream:*"
                  - !Sub "${RunnerUserdataLogGroup.Arn}:log-stream:*"

  RunnerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${AWS::StackName}-runner"
      Roles:
        - !Ref RunnerRole

  # --- Webhook Lambda ---

  WebhookLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-webhook-lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WebhookLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ScaleUpQueue.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt LifecycleQueue.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref WebhookSecretArn
                  - !Ref PrivateKeySecretArn

  WebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-webhook"
      Description: Receives GitHub workflow_job webhooks and enqueues scale-up messages.
      Runtime: provided.al2023
      Handler: webhook
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref WebhookLambdaS3Key
      Timeout: 25
      MemorySize: 128
      Role: !GetAtt WebhookLambdaRole.Arn
      Environment:
        Variables:
          GITHUB_APP_ID: !Ref GitHubAppId
          GITHUB_INSTALLATION_ID: !Ref GitHubInstallationId
          GITHUB_APP_WEBHOOK_SECRET_ARN: !Ref WebhookSecretArn
          GITHUB_APP_PRIVATE_KEY_SECRET_ARN: !Ref PrivateKeySecretArn
          SQS_QUEUE_URL: !Ref ScaleUpQueue
          LIFECYCLE_QUEUE_URL: !Ref LifecycleQueue
          DYNAMODB_TABLE_NAME: !Ref RunnersTable

  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-webhook"
      RetentionInDays: 14

  # --- API Gateway ---

  WebhookApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-webhook"
      ProtocolType: HTTP

  WebhookApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebhookApi
      StageName: "$default"
      AutoDeploy: true

  WebhookIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebhookApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt WebhookFunction.Arn
      PayloadFormatVersion: "2.0"

  WebhookRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebhookApi
      RouteKey: "POST /webhook"
      Target: !Sub "integrations/${WebhookIntegration}"

  ApiGatewayLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebhookFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebhookApi}/*/*"

  # --- Scale-Up Lambda ---

  ScaleUpLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-scaleup-lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ScaleUpLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ScaleUpQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt RunnersTable.Arn
              - Effect: Allow
                Action:
                  - ec2:RunInstances
                  - ec2:CreateTags
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RunnerRole.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref WebhookSecretArn
                  - !Ref PrivateKeySecretArn
        - PolicyName: SSMReadRunnerLogLevel
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jit-runners/runner-log-level"

  ScaleUpFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-scaleup"
      Description: Launches EC2 spot instances as JIT GitHub Actions runners.
      Runtime: provided.al2023
      Handler: scaleup
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref ScaleUpLambdaS3Key
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt ScaleUpLambdaRole.Arn
      Environment:
        Variables:
          GITHUB_APP_ID: !Ref GitHubAppId
          GITHUB_INSTALLATION_ID: !Ref GitHubInstallationId
          GITHUB_APP_WEBHOOK_SECRET_ARN: !Ref WebhookSecretArn
          GITHUB_APP_PRIVATE_KEY_SECRET_ARN: !Ref PrivateKeySecretArn
          SQS_QUEUE_URL: !Ref ScaleUpQueue
          DYNAMODB_TABLE_NAME: !Ref RunnersTable
          EC2_SUBNET_IDS: !Join [",", !Ref SubnetIds]
          EC2_SECURITY_GROUP_ID: !Ref RunnerSecurityGroup
          EC2_IAM_INSTANCE_PROFILE: !Ref RunnerInstanceProfile
          EC2_DEFAULT_AMI: !Ref DefaultAMI
          LABEL_MAPPINGS: !Ref LabelMappings

  ScaleUpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-scaleup"
      RetentionInDays: 14

  ScaleUpEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ScaleUpQueue.Arn
      FunctionName: !Ref ScaleUpFunction
      BatchSize: 1

  # --- Scale-Down Lambda ---

  ScaleDownLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-scaledown-lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ScaleDownLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource: !GetAtt RunnersTable.Arn
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:TerminateInstances
                Resource: "*"
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ScaleUpQueue.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref WebhookSecretArn
                  - !Ref PrivateKeySecretArn

  ScaleDownFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-scaledown"
      Description: Cleans up stale and orphaned runner EC2 instances.
      Runtime: provided.al2023
      Handler: scaledown
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref ScaleDownLambdaS3Key
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt ScaleDownLambdaRole.Arn
      Environment:
        Variables:
          GITHUB_APP_ID: !Ref GitHubAppId
          GITHUB_INSTALLATION_ID: !Ref GitHubInstallationId
          GITHUB_APP_WEBHOOK_SECRET_ARN: !Ref WebhookSecretArn
          GITHUB_APP_PRIVATE_KEY_SECRET_ARN: !Ref PrivateKeySecretArn
          SQS_QUEUE_URL: !Ref ScaleUpQueue
          SCALEUP_QUEUE_URL: !Ref ScaleUpQueue
          DYNAMODB_TABLE_NAME: !Ref RunnersTable
          STALE_THRESHOLD_MINUTES: !Ref StaleThresholdMinutes
          MAX_RUNNER_AGE_MINUTES: !Ref MaxRunnerAgeMinutes
          MAX_RE_ENQUEUE_ATTEMPTS: !Ref MaxReEnqueueAttempts

  ScaleDownLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-scaledown"
      RetentionInDays: 14

  # --- Lifecycle Lambda ---

  LifecycleFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-lifecycle-lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: lifecycle-permissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt LifecycleQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt RunnersTable.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref PrivateKeySecretArn

  RebalancerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-rebalancer-lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RebalancerLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt ScaleUpQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource: !GetAtt RunnersTable.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref WebhookSecretArn
                  - !Ref PrivateKeySecretArn

  LifecycleFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-lifecycle"
      Description: Consumes lifecycle events; updates DDB through pending/running/completed and deregisters runners.
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LifecycleLambdaS3Key
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LifecycleFunctionRole.Arn
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref RunnersTable
          DYNAMODB_TABLE_NAME: !Ref RunnersTable
          GITHUB_APP_ID: !Ref GitHubAppId
          GITHUB_INSTALLATION_ID: !Ref GitHubInstallationId
          PRIVATE_KEY_SECRET_ARN: !Ref PrivateKeySecretArn
          GITHUB_APP_PRIVATE_KEY_SECRET_ARN: !Ref PrivateKeySecretArn

  LifecycleLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-lifecycle"
      RetentionInDays: 14

  RebalancerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-rebalancer"
      Description: Periodic re-publisher of ScaleUpMessages to drain stranded queued GitHub Actions jobs.
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures:
        - x86_64
      Timeout: 60
      MemorySize: 256
      # ReservedConcurrentExecutions: 1 omitted — the deploy account currently
      # has the default Lambda concurrency floor (10), so any reservation
      # rejects with "decreases UnreservedConcurrentExecutions below minimum".
      # Re-add once the account quota is raised. Risk while omitted: if a
      # cycle takes >60s, two concurrent ticks could double-publish; bounded
      # cost — redundant runners get reaped by scaledown's stale sweep.
      Role: !GetAtt RebalancerLambdaRole.Arn
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref RebalancerLambdaS3Key
      Environment:
        Variables:
          GITHUB_APP_ID: !Ref GitHubAppId
          GITHUB_INSTALLATION_ID: !Ref GitHubInstallationId
          GITHUB_APP_PRIVATE_KEY_SECRET_ARN: !Ref PrivateKeySecretArn
          GITHUB_APP_WEBHOOK_SECRET_ARN: !Ref WebhookSecretArn
          DYNAMODB_TABLE_NAME: !Ref RunnersTable
          SQS_QUEUE_URL: !Ref ScaleUpQueue

  RebalancerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-rebalancer"
      RetentionInDays: 14

  RebalancerSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-rebalancer-schedule"
      Description: Fires the rebalancer Lambda every 1 minute to drain stranded queued jobs.
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Id: RebalancerTarget
          Arn: !GetAtt RebalancerFunction.Arn

  RebalancerSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RebalancerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RebalancerSchedule.Arn

  LifecycleFunctionEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt LifecycleQueue.Arn
      FunctionName: !Ref LifecycleFunction
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 1

  # --- EventBridge Scheduler ---

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-scheduler"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeScaleDown
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ScaleDownFunction.Arn

  ScaleDownSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-scaledown"
      ScheduleExpression: "rate(5 minutes)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ScaleDownFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

  # --- Diagnostic logging (issue #55) ---

  RunnerAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /jit-runners/runner-agent
      RetentionInDays: 14

  RunnerUserdataLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /jit-runners/userdata
      RetentionInDays: 14

  SilentFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: RunnerUserdataLogGroup
    Properties:
      LogGroupName: /jit-runners/userdata
      FilterPattern: "JIT_NO_JOB_PICKUP"
      MetricTransformations:
        - MetricName: SilentFailures
          MetricNamespace: JitRunners/RunnerAgent
          MetricValue: "1"
          DefaultValue: 0

  RunnerLogLevelParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jit-runners/runner-log-level
      Type: String
      Value: info
      AllowedPattern: "^(info|debug)$"
      Description: |
        Controls runner-agent verbosity. Set to "debug" while
        investigating; flip back to "info" afterward. Read by the
        scaleup Lambda on each invocation (30s in-process cache).

Outputs:
  WebhookUrl:
    Description: Set this as the GitHub App webhook URL (Payload URL).
    Value: !Sub "${WebhookApi.ApiEndpoint}/webhook"
    Export:
      Name: !Sub "${AWS::StackName}-WebhookUrl"

  WebhookLambdaArn:
    Description: ARN of the webhook Lambda function.
    Value: !GetAtt WebhookFunction.Arn

  ScaleUpLambdaArn:
    Description: ARN of the scale-up Lambda function.
    Value: !GetAtt ScaleUpFunction.Arn

  ScaleDownLambdaArn:
    Description: ARN of the scale-down Lambda function.
    Value: !GetAtt ScaleDownFunction.Arn

  LifecycleFunctionArn:
    Description: ARN of the lifecycle Lambda function.
    Value: !GetAtt LifecycleFunction.Arn

  LifecycleQueueUrl:
    Description: SQS queue URL for lifecycle messages (workflow_job in_progress / completed).
    Value: !Ref LifecycleQueue

  LifecycleQueueDLQUrl:
    Description: SQS DLQ URL for lifecycle messages.
    Value: !Ref LifecycleQueueDLQ

  DynamoDBTableName:
    Description: DynamoDB table name for runner state.
    Value: !Ref RunnersTable

  SQSQueueUrl:
    Description: SQS queue URL for scale-up messages.
    Value: !Ref ScaleUpQueue

  RunnerSecurityGroupId:
    Description: Security group ID for runner EC2 instances.
    Value: !Ref RunnerSecurityGroup

  RunnerInstanceProfileName:
    Description: IAM instance profile name for runner EC2 instances.
    Value: !Ref RunnerInstanceProfile
